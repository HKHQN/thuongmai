<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Production Notes Pro</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
}

.card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    margin-top: 20px;
    transition: all 0.3s ease;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 25px 70px rgba(0,0,0,0.4);
}

h2 {
    color: #2d3436;
    font-size: 28px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.subtitle {
    color: #636e72;
    font-size: 14px;
    margin-bottom: 20px;
}

.google {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.google:hover {
    transform: scale(1.02);
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
}

.logout {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: white;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 600;
}

.logout:hover {
    transform: scale(1.02);
    box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
}

.save {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: white;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 600;
    margin-top: 10px;
}

.save:hover {
    transform: scale(1.02);
    box-shadow: 0 10px 30px rgba(0, 206, 201, 0.4);
}

textarea {
    width: 100%;
    height: 140px;
    padding: 15px;
    border-radius: 12px;
    border: 2px solid #dfe6e9;
    margin-top: 10px;
    font-size: 16px;
    transition: all 0.3s ease;
    resize: vertical;
}

textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
}

.profile-section {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 15px;
    margin-bottom: 20px;
}

.profile-section img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid #667eea;
}

.profile-info {
    flex: 1;
}

.profile-info h3 {
    color: #2d3436;
    font-size: 20px;
    margin-bottom: 5px;
}

.profile-info p {
    color: #636e72;
    font-size: 14px;
}

.stats {
    display: flex;
    gap: 20px;
    margin: 15px 0;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 12px;
}

.stat-item {
    text-align: center;
    flex: 1;
}

.stat-number {
    font-size: 24px;
    font-weight: bold;
    color: #667eea;
}

.stat-label {
    font-size: 12px;
    color: #636e72;
    margin-top: 5px;
}

.note {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-top: 15px;
    border-left: 4px solid #667eea;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
    animation: slideIn 0.3s ease;
}

.note:hover {
    transform: translateX(5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.note-content {
    font-size: 16px;
    color: #2d3436;
    line-height: 1.6;
    margin-bottom: 10px;
}

.note-time {
    font-size: 12px;
    color: #b2bec3;
    display: flex;
    align-items: center;
    gap: 5px;
}

.note-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.note-actions button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 600;
}

.edit {
    background: #dfe6e9;
    color: #2d3436;
}

.edit:hover {
    background: #b2bec3;
    transform: scale(1.02);
}

.delete {
    background: #ff6b6b;
    color: white;
}

.delete:hover {
    background: #ee5a24;
    transform: scale(1.02);
}

.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #b2bec3;
}

.empty-state .icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.empty-state h3 {
    color: #2d3436;
    margin-bottom: 10px;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #636e72;
}

.spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #667eea;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@media (max-width: 600px) {
    .profile-section {
        flex-direction: column;
        text-align: center;
    }
    
    .stats {
        flex-direction: column;
        gap: 10px;
    }
    
    .note-actions {
        flex-direction: column;
    }
    
    .card {
        padding: 15px;
    }
}
</style>
</head>

<body>
<div class="container">
    <div class="card" id="loginCard">
        <h2>📝 Production Notes</h2>
        <p class="subtitle">Đăng nhập để lưu và quản lý ghi chú sản xuất của bạn</p>
        <button class="google" id="login">
            🚀 Đăng nhập bằng Google
        </button>
    </div>

    <div class="card" id="appCard" style="display:none">
        <div class="profile-section">
            <img id="avatar" alt="Avatar">
            <div class="profile-info">
                <h3 id="name"></h3>
                <p id="email"></p>
            </div>
            <button class="logout" id="logout" style="width:auto;padding:10px 20px;">
                Đăng xuất
            </button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalNotes">0</div>
                <div class="stat-label">Tổng ghi chú</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="todayNotes">0</div>
                <div class="stat-label">Hôm nay</div>
            </div>
        </div>

        <textarea id="note" placeholder="Nhập ghi chú về sản xuất..."></textarea>
        <button class="save" id="save">
            💾 Lưu ghi chú
        </button>

        <hr style="margin:20px 0;border:1px solid #f0f0f0;">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h3 style="color:#2d3436;">📋 Danh sách ghi chú</h3>
            <span style="font-size:14px;color:#b2bec3;" id="noteCount">0 ghi chú</span>
        </div>
        
        <div id="list"></div>
    </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    remove,
    update
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyASfKSM4k9PVqGSu2ycd5Uv1ax0vbScg0I",
    authDomain: "soloskill.firebaseapp.com",
    databaseURL: "https://soloskill-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "soloskill",
    storageBucket: "soloskill.firebasestorage.app",
    messagingSenderId: "959816905162",
    appId: "1:959816905162:web:2a7c6b8dd0cb985a71df33",
    measurementId: "G-05TCE6B63Y"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

let uid = "";
let editId = null;
let notesData = [];

// DOM elements
const loginBtn = document.getElementById('login');
const logoutBtn = document.getElementById('logout');
const saveBtn = document.getElementById('save');
const noteInput = document.getElementById('note');
const listDiv = document.getElementById('list');
const loginCard = document.getElementById('loginCard');
const appCard = document.getElementById('appCard');
const avatar = document.getElementById('avatar');
const nameDisplay = document.getElementById('name');
const emailDisplay = document.getElementById('email');
const totalNotesSpan = document.getElementById('totalNotes');
const todayNotesSpan = document.getElementById('todayNotes');
const noteCountSpan = document.getElementById('noteCount');

// Auth handlers
loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
    if (user) {
        uid = user.uid;
        loginCard.style.display = "none";
        appCard.style.display = "block";
        avatar.src = user.photoURL || 'https://ui-avatars.com/api/?name=' + user.displayName;
        nameDisplay.textContent = user.displayName || 'User';
        emailDisplay.textContent = user.email;
        loadNotes();
    } else {
        loginCard.style.display = "block";
        appCard.style.display = "none";
        notesData = [];
        updateStats();
    }
});

// Save note
saveBtn.onclick = () => {
    const text = noteInput.value.trim();
    if (!text) {
        noteInput.focus();
        noteInput.style.borderColor = '#ff6b6b';
        setTimeout(() => noteInput.style.borderColor = '#dfe6e9', 2000);
        return;
    }

    if (editId) {
        // Update existing note
        update(ref(db, "notes/" + uid + "/" + editId), {
            text: text,
            time: new Date().toLocaleString('vi-VN'),
            updated: true
        });
        editId = null;
        saveBtn.textContent = '💾 Lưu ghi chú';
    } else {
        // Create new note
        const id = push(ref(db, "notes/" + uid)).key;
        set(ref(db, "notes/" + uid + "/" + id), {
            text: text,
            time: new Date().toLocaleString('vi-VN'),
            created: new Date().toISOString()
        });
    }

    noteInput.value = "";
    noteInput.focus();
};

// Load notes
function loadNotes() {
    onValue(ref(db, "notes/" + uid), snap => {
        listDiv.innerHTML = "";
        notesData = [];
        
        if (!snap.exists()) {
            listDiv.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📝</div>
                    <h3>Chưa có ghi chú nào</h3>
                    <p>Hãy tạo ghi chú đầu tiên của bạn!</p>
                </div>
            `;
            updateStats();
            return;
        }

        // Collect all notes
        snap.forEach(data => {
            const v = data.val();
            notesData.push({
                id: data.key,
                text: v.text,
                time: v.time || 'Không có thời gian',
                created: v.created || new Date().toISOString()
            });
        });

        // Sort by time (newest first)
        notesData.sort((a, b) => {
            return new Date(b.created) - new Date(a.created);
        });

        // Render notes
        notesData.forEach(note => {
            const div = document.createElement("div");
            div.className = "note";
            div.innerHTML = `
                <div class="note-content">${note.text}</div>
                <div class="note-time">🕐 ${note.time}</div>
                <div class="note-actions">
                    <button class="edit">✏️ Sửa</button>
                    <button class="delete">🗑️ Xóa</button>
                </div>
            `;

            div.querySelector(".edit").onclick = () => {
                noteInput.value = note.text;
                editId = note.id;
                saveBtn.textContent = '🔄 Cập nhật';
                window.scrollTo({ top: 0, behavior: "smooth" });
                noteInput.focus();
            };

            div.querySelector(".delete").onclick = () => {
                if (confirm('Bạn có chắc muốn xóa ghi chú này?')) {
                    remove(ref(db, "notes/" + uid + "/" + note.id));
                }
            };

            listDiv.appendChild(div);
        });

        updateStats();
    });
}

// Update statistics
function updateStats() {
    const total = notesData.length;
    totalNotesSpan.textContent = total;
    noteCountSpan.textContent = total + ' ghi chú';
    
    // Count notes from today
    const today = new Date().toDateString();
    const todayCount = notesData.filter(note => {
        if (!note.created) return false;
        return new Date(note.created).toDateString() === today;
    }).length;
    todayNotesSpan.textContent = todayCount;
}

// Keyboard shortcuts
noteInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.ctrlKey) {
        saveBtn.click();
    }
});

console.log('📝 Production Notes Pro loaded successfully!');
</script>
</body>
</html>
