<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <!-- Tối ưu viewport chống zoom trên Safari iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tiền Bỏ Thi - iOS Edition</title>
    <!-- Thiết lập chế độ Web App chạy toàn màn hình trên iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1040/1040249.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent; /* Tắt vệt tối khi nhấn trên iOS */
        }
        
        /* Tối ưu Safe Area cho các máy có tai thỏ / Dynamic Island */
        .safe-top {
            padding-top: env(safe-area-inset-top, 20px);
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .pb-safe-fab {
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 80px);
        }

        /* Hiệu ứng Bottom Sheet mượt mà chuẩn iOS */
        .bottom-sheet {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100%);
        }
        .bottom-sheet.show {
            transform: translateY(0);
        }

        /* Ẩn thanh cuộn mặc định */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-50 h-full flex flex-col text-slate-900 select-none">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex flex-col items-center justify-between h-full px-8 py-12 safe-top safe-bottom">
        <div class="my-auto text-center">
            <div class="inline-flex items-center justify-center w-28 h-28 bg-emerald-50 rounded-[2rem] shadow-xl shadow-emerald-100/50 mb-6">
                <img src="https://cdn-icons-png.flaticon.com/512/1040/1040249.png" alt="Icon" class="w-16 h-16">
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">Tiền Bỏ Thi</h1>
            <p class="text-slate-500 mt-2 text-base font-medium">Quản lý tài chính cá nhân tinh gọn</p>
        </div>
        
        <button onclick="loginWithGoogle()" 
                class="w-full max-w-sm flex items-center justify-center gap-x-3 bg-white border border-slate-200 hover:border-slate-300 active:scale-95 transition-all shadow-md py-4 rounded-2xl font-semibold text-base text-slate-800">
            <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" class="w-5 h-5" alt="Google">
            Tiếp tục với Google
        </button>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden flex flex-col h-full overflow-hidden">
        
        <!-- HEADER & BALANCE BAR (Được gom cụm ôm trọn góc trên) -->
        <header class="bg-gradient-to-b from-emerald-600 to-emerald-700 text-white safe-top shadow-md z-30">
            <div class="px-5 py-4 flex justify-between items-center">
                <div class="flex items-center gap-x-2.5">
                    <img src="https://cdn-icons-png.flaticon.com/512/1040/1040249.png" class="w-8 h-8 brightness-0 invert">
                    <h1 class="text-xl font-bold tracking-tight">Tiền Bỏ Thi</h1>
                </div>
                <div class="flex items-center gap-x-3">
                    <div id="user-info" class="flex items-center gap-x-2 text-sm font-medium"></div>
                    <button onclick="logout()" class="text-emerald-100 hover:text-white text-xs bg-emerald-800/40 px-3 py-1.5 rounded-full font-medium">Đăng xuất</button>
                </div>
            </div>

            <!-- Tổng số dư -->
            <div class="px-5 pb-6 pt-2 grid grid-cols-2 gap-4">
                <div>
                    <span class="text-emerald-200/90 text-xs font-semibold uppercase tracking-wider">Số dư hiện tại</span>
                    <div id="balance" class="text-2xl font-bold tracking-tight mt-1">0 đ</div>
                </div>
                <div class="text-right">
                    <span class="text-emerald-200/90 text-xs font-semibold uppercase tracking-wider">Tổng đã tiêu</span>
                    <div id="total-spent" class="text-2xl font-bold text-rose-200 tracking-tight mt-1">0 đ</div>
                </div>
            </div>

            <!-- Segmented Control chuẩn iOS để đổi Tab -->
            <div class="px-5 pb-3">
                <div class="bg-emerald-800/40 p-1 rounded-xl flex">
                    <button onclick="switchTab(0)" id="tab-0" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-emerald-100 bg-transparent" style="font-size: 0.8rem;">
                        CHI TIÊU
                    </button>
                    <button onclick="switchTab(1)" id="tab-1" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-emerald-100 bg-transparent" style="font-size: 0.8rem;">
                        THU NHẬP
                    </button>
                </div>
            </div>
        </header>

        <!-- MAIN SCROLLABLE CONTENT -->
        <main class="flex-1 overflow-y-auto pb-safe-fab bg-slate-50">
            <div class="px-4 pt-4">
                <!-- Tab Chi tiêu -->
                <div id="content-0" class="tab-content space-y-3">
                    <div id="table-chi-tieu" class="space-y-3"></div>
                    <div id="pagination-chi" class="flex justify-center gap-2 pt-4"></div>
                </div>
                
                <!-- Tab Thu nhập -->
                <div id="content-1" class="tab-content hidden space-y-3">
                    <div id="table-thu-nhap" class="space-y-3"></div>
                    <div id="pagination-thu" class="flex justify-center gap-2 pt-4"></div>
                </div>
            </div>
        </main>

        <!-- Nút thêm nhanh FAB (Đặt bên góc dưới tối ưu lực nhấn một tay trên iPhone) -->
        <button onclick="showAddModal()" 
                class="fixed bottom-6 right-5 w-14 h-14 bg-emerald-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-emerald-600/30 active:scale-90 transition-transform z-40 safe-bottom">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
        </button>
    </div>

    <!-- iOS Bottom Sheet (Modal vuốt đáy) -->
    <div id="modal-backdrop" onclick="hideModal()" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 transition-opacity duration-300 opacity-0"></div>
    <div id="modal" class="bottom-sheet fixed bottom-0 left-0 right-0 bg-white rounded-t-[2rem] z-50 flex flex-col max-h-[88vh] safe-bottom shadow-2xl">
        <!-- Thanh gờ vuốt trên đầu Modal (iOS style indicator) -->
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto my-3.5 flex-shrink-0" onclick="hideModal()"></div>
        
        <div class="px-6 pb-3 flex justify-between items-center border-b border-slate-100">
            <h3 id="modal-title" class="text-xl font-bold text-slate-900">Thêm khoản</h3>
            <button onclick="hideModal()" class="text-sm font-semibold text-emerald-600 active:opacity-60">Hủy</button>
        </div>
        
        <form id="edit-form" onsubmit="handleSubmit(event)" class="p-6 overflow-y-auto space-y-4">
            <input type="hidden" id="node-type">
            <input type="hidden" id="edit-key">
            
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-400 uppercase">Ngày giao dịch</label>
                <input type="date" id="ngay" required class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:border-emerald-500 font-medium text-base">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-400 uppercase">Danh mục</label>
                <input type="text" id="danh_muc" required placeholder="Ví dụ: Ăn uống, Di chuyển..." class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:border-emerald-500 font-medium text-base">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-400 uppercase">Mô tả chi tiết</label>
                <input type="text" id="mo_ta" required placeholder="Ví dụ: Ăn trưa phở bò" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:border-emerald-500 font-medium text-base">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 uppercase">Số tiền (đ)</label>
                    <input type="number" id="so_tien" required placeholder="Nhập số tiền" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:border-emerald-500 font-medium text-base">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 uppercase">Ghi chú thêm</label>
                    <input type="text" id="ghi_chu" placeholder="Không bắt buộc" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:border-emerald-500 font-medium text-base">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full py-4 bg-emerald-600 active:bg-emerald-700 text-white rounded-xl font-bold text-base shadow-lg shadow-emerald-600/10 transition-colors">
                    Hoàn thành & Lưu
                </button>
            </div>
        </form>
    </div>

    <script>
        // Cấu hình Firebase giữ nguyên từ phiên bản gốc của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyBIIWxW_jTP1BpGOaIa9atr_sFhRlz3fJ0",
            authDomain: "tienbothi.firebaseapp.com",
            databaseURL: "https://tienbothi-default-rtdb.firebaseio.com",
            projectId: "tienbothi",
            storageBucket: "tienbothi.firebasestorage.app",
            messagingSenderId: "353470247741",
            appId: "1:353470247741:web:2cf921cc96ba0353e2cb54"
        };

        let app, auth, db, currentUser = null;
        let ITEMS_PER_PAGE = 10;
        let currentTab = 0;

        function initFirebase() {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.database();

            auth.onAuthStateChanged(user => {
                currentUser = user;
                if (user) {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('user-info').innerHTML = `
                        <img src="${user.photoURL || ''}" class="w-6 h-6 rounded-full border border-white/20"> 
                        <span class="max-w-[80px] truncate">${user.displayName.split(' ').pop()}</span>`;
                    loadAllData();
                    switchTab(0); // Mặc định mở tab Chi tiêu khi vào
                } else {
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('main-app').classList.add('hidden');
                }
            });
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert(err.message));
        }

        function logout() { auth.signOut(); }

        function getUserRef(type) {
            return db.ref(`users/${currentUser.uid}/${type}`);
        }

        let allChi = {}, allThu = {};

        function loadAllData() {
            if (!currentUser) return;

            getUserRef('chi-tieu').on('value', snap => {
                allChi = snap.val() || {};
                renderPage('chi-tieu', 1);
                calculateBalance();
            });

            getUserRef('thu-nhap').on('value', snap => {
                allThu = snap.val() || {};
                renderPage('thu-nhap', 1);
                calculateBalance();
            });
        }

        function calculateBalance() {
            let totalThu = 0, totalChi = 0;
            Object.values(allThu).forEach(i => totalThu += Number(i.so_tien || 0));
            Object.values(allChi).forEach(i => totalChi += Number(i.so_tien || 0));

            document.getElementById('balance').textContent = (totalThu - totalChi).toLocaleString('vi-VN') + ' đ';
            document.getElementById('total-spent').textContent = totalChi.toLocaleString('vi-VN') + ' đ';
        }

        function renderPage(type, page) {
            const data = type === 'chi-tieu' ? allChi : allThu;
            // Sắp xếp ngày giao dịch mới nhất lên đầu tiên
            const keys = Object.keys(data).sort((a,b) => {
                return new Date(data[b].ngay) - new Date(data[a].ngay);
            });
            const totalPages = Math.ceil(keys.length / ITEMS_PER_PAGE);
            const start = (page - 1) * ITEMS_PER_PAGE;
            const pageData = keys.slice(start, start + ITEMS_PER_PAGE);

            const container = document.getElementById(type === 'chi-tieu' ? 'table-chi-tieu' : 'table-thu-nhap');
            container.innerHTML = '';

            if (pageData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <p class="text-sm">Chưa có giao dịch nào được tạo</p>
                    </div>`;
                return;
            }

            pageData.forEach(key => {
                const item = data[key];
                const amount = Number(item.so_tien || 0);
                const isChi = type === 'chi-tieu';
                
                // Định dạng hiển thị ngày sang kiểu ngắn chuẩn Việt Nam
                const formattedDate = new Date(item.ngay).toLocaleDateString('vi-VN', {day: 'numeric', month: 'numeric'});

                const html = `
                    <div class="bg-white rounded-2xl p-4 border border-slate-100 flex flex-col justify-between shadow-sm active:scale-[0.98] transition-all">
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex items-start gap-3">
                                <div class="px-2.5 py-1.5 bg-slate-100 text-slate-600 rounded-xl text-center flex flex-col justify-center items-center min-w-[45px]">
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Hôm nay</span>
                                    <span class="text-sm font-bold text-slate-700">${formattedDate}</span>
                                </div>
                                <div class="overflow-hidden">
                                    <div class="font-bold text-slate-800 text-base truncate">${item.danh_muc}</div>
                                    <div class="text-sm text-slate-500 font-medium mt-0.5 truncate">${item.mo_ta}</div>
                                    ${item.ghi_chu ? `<div class="text-xs italic text-slate-400 mt-1.5">Ghi chú: ${item.ghi_chu}</div>` : ''}
                                </div>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <span class="font-extrabold text-lg ${isChi ? 'text-rose-600' : 'text-emerald-600'}">
                                    ${isChi ? '-' : '+'}${amount.toLocaleString('vi-VN')} đ
                                </span>
                            </div>
                        </div>
                        <div class="mt-4 flex gap-2 pt-3 border-t border-slate-50">
                            <button onclick="editItem('${type}', '${key}')" class="flex-1 py-2 bg-amber-50 active:bg-amber-100/70 text-amber-700 rounded-xl text-xs font-bold transition-all">Sửa</button>
                            <button onclick="deleteItem('${type}', '${key}')" class="flex-1 py-2 bg-rose-50 active:bg-rose-100/70 text-rose-600 rounded-xl text-xs font-bold transition-all">Xóa</button>
                        </div>
                    </div>`;
                container.innerHTML += html;
            });

            // Giao diện nút phân trang
            const pagContainer = document.getElementById(type === 'chi-tieu' ? 'pagination-chi' : 'pagination-thu');
            pagContainer.innerHTML = '';
            if (totalPages > 1) {
                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.textContent = i;
                    btn.className = `w-8 h-8 rounded-full text-xs font-bold flex items-center justify-center ${i === page ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}`;
                    btn.onclick = () => renderPage(type, i);
                    pagContainer.appendChild(btn);
                }
            }
        }

        // Thiết kế cơ chế đổi Tab kiểu Segmented Control
        function switchTab(tab) {
            currentTab = tab;
            const btn0 = document.getElementById('tab-0');
            const btn1 = document.getElementById('tab-1');

            if (tab === 0) {
                btn0.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-white text-emerald-800 shadow";
                btn1.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-emerald-100 bg-transparent";
                document.getElementById('content-0').classList.remove('hidden');
                document.getElementById('content-1').classList.add('hidden');
            } else {
                btn1.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-white text-emerald-800 shadow";
                btn0.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-emerald-100 bg-transparent";
                document.getElementById('content-1').classList.remove('hidden');
                document.getElementById('content-0').classList.add('hidden');
            }
        }

        let currentEditKey = null;

        function showAddModal() {
            currentEditKey = null;
            document.getElementById('modal-title').textContent = currentTab === 0 ? 'Thêm Chi Tiêu' : 'Thêm Thu Nhập';
            document.getElementById('node-type').value = currentTab === 0 ? 'chi-tieu' : 'thu-nhap';
            document.getElementById('edit-form').reset();
            document.getElementById('ngay').value = new Date().toISOString().split('T')[0];
            
            showSheet();
        }

        function editItem(type, key) {
            currentEditKey = key;
            document.getElementById('node-type').value = type;
            document.getElementById('modal-title').textContent = 'Sửa Giao Dịch';

            getUserRef(type).child(key).once('value', snap => {
                const d = snap.val();
                if (d) {
                    document.getElementById('ngay').value = d.ngay || '';
                    document.getElementById('danh_muc').value = d.danh_muc || '';
                    document.getElementById('mo_ta').value = d.mo_ta || '';
                    document.getElementById('so_tien').value = d.so_tien || '';
                    document.getElementById('ghi_chu').value = d.ghi_chu || '';
                    showSheet();
                }
            });
        }

        // Tạo chuyển động Bottom Sheet 
        function showSheet() {
            const backdrop = document.getElementById('modal-backdrop');
            const sheet = document.getElementById('modal');
            backdrop.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.add('opacity-100');
                sheet.classList.add('show');
            }, 10);
        }

        function hideModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const sheet = document.getElementById('modal');
            backdrop.classList.remove('opacity-100');
            sheet.classList.remove('show');
            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 300);
        }

        function handleSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('node-type').value;
            const ref = getUserRef(type);
            const key = currentEditKey;

            const payload = {
                danh_muc: document.getElementById('danh_muc').value.trim(),
                mo_ta: document.getElementById('mo_ta').value.trim(),
                ngay: document.getElementById('ngay').value,
                so_tien: parseInt(document.getElementById('so_tien').value) || 0,
                ghi_chu: document.getElementById('ghi_chu').value.trim() || null,
                thoi_gian: Date.now()
            };

            if (key) ref.child(key).update(payload).then(() => hideModal());
            else ref.push(payload).then(() => hideModal());
        }

        function deleteItem(type, key) {
            if (confirm('Bạn chắc chắn muốn xóa giao dịch này?')) {
                getUserRef(type).child(key).remove();
            }
        }

        window.onload = initFirebase;
    </script>
</body>
</html>
