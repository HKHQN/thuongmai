<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiền Bỏ Thi</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1040/1040249.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .modal { animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { 
            from { opacity: 0; transform: scale(0.92) translateY(20px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        .card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .fab { box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen px-6">
        <div class="text-center mb-12">
            <img src="https://cdn-icons-png.flaticon.com/512/1040/1040249.png" alt="Icon" class="w-24 h-24 mx-auto mb-6">
            <h1 class="text-4xl font-bold text-slate-900">Tiền Bỏ Thi</h1>
            <p class="text-slate-500 mt-2">Quản lý chi tiêu & thu nhập realtime</p>
        </div>
        
        <button onclick="loginWithGoogle()" 
                class="w-full max-w-sm flex items-center justify-center gap-x-3 bg-white border border-slate-300 hover:border-slate-400 shadow-sm py-4 rounded-3xl font-medium text-lg">
            <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" class="w-6 h-6" alt="Google">
            Đăng nhập bằng Google
        </button>
        
        <p class="text-xs text-slate-400 mt-8 text-center max-w-xs">
            Đăng nhập để đồng bộ dữ liệu trên mọi thiết bị
        </p>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden">
        <div class="max-w-2xl mx-auto">
            <!-- Header -->
            <div class="bg-white border-b sticky top-0 z-50">
                <div class="px-5 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-x-3">
                        <img src="https://cdn-icons-png.flaticon.com/512/1040/1040249.png" alt="Icon" class="w-9 h-9">
                        <div>
                            <h1 class="text-2xl font-semibold text-slate-900">Tiền Bỏ Thi</h1>
                        </div>
                    </div>
                    <div class="flex items-center gap-x-4">
                        <div id="user-info" class="flex items-center gap-x-2 text-sm"></div>
                        <button onclick="logout()" 
                                class="px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-2xl">Đăng xuất</button>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex border-b border-slate-200 px-5">
                    <button onclick="switchTab(0)" id="tab-0"
                            class="tab-button flex-1 py-4 text-center font-semibold text-base border-b-4 border-transparent active">CHI TIÊU</button>
                    <button onclick="switchTab(1)" id="tab-1"
                            class="tab-button flex-1 py-4 text-center font-semibold text-base border-b-4 border-transparent">THU NHẬP</button>
                </div>
            </div>

            <!-- Content -->
            <div class="px-5 pt-6 pb-24">
                <div id="content-0" class="tab-content">
                    <div id="table-chi-tieu" class="space-y-4"></div>
                </div>
                <div id="content-1" class="tab-content hidden">
                    <div id="table-thu-nhap" class="space-y-4"></div>
                </div>
            </div>

            <!-- FAB -->
            <button onclick="showAddModal()" 
                    class="fab fixed bottom-6 right-6 w-16 h-16 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl flex items-center justify-center shadow-2xl z-50 transition-all active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" onclick="if(event.target===this) hideModal()" 
         class="hidden fixed inset-0 bg-black/70 flex items-end md:items-center justify-center z-[100]">
        <div onclick="event.stopImmediatePropagation()" 
             class="modal bg-white w-full md:max-w-lg md:rounded-3xl rounded-t-3xl max-h-[92vh] overflow-auto">
            <div class="sticky top-0 bg-white px-6 py-5 border-b flex justify-between items-center">
                <h3 id="modal-title" class="text-2xl font-semibold">Thêm khoản mới</h3>
                <button onclick="hideModal()" class="text-4xl leading-none text-slate-400 hover:text-slate-600">×</button>
            </div>
            
            <form id="edit-form" onsubmit="handleSubmit(event)" class="p-6 space-y-6">
                <input type="hidden" id="node-type">
                <input type="hidden" id="edit-key">

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">Ngày</label>
                    <input type="date" id="ngay" required class="w-full px-5 py-4 border border-slate-200 rounded-2xl focus:border-emerald-500 text-base">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">Danh mục</label>
                    <input type="text" id="danh_muc" required placeholder="Ăn uống, Lương..." 
                           class="w-full px-5 py-4 border border-slate-200 rounded-2xl focus:border-emerald-500 text-base">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">Mô tả</label>
                    <input type="text" id="mo_ta" required placeholder="Chi tiết..." 
                           class="w-full px-5 py-4 border border-slate-200 rounded-2xl focus:border-emerald-500 text-base">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">Số tiền (đ)</label>
                        <input type="number" id="so_tien" required class="w-full px-5 py-4 border border-slate-200 rounded-2xl focus:border-emerald-500 text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">Ghi chú</label>
                        <input type="text" id="ghi_chu" placeholder="Tùy chọn" 
                               class="w-full px-5 py-4 border border-slate-200 rounded-2xl focus:border-emerald-500 text-base">
                    </div>
                </div>

                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="hideModal()" class="flex-1 py-4 border border-slate-300 rounded-2xl font-medium">Hủy</button>
                    <button type="submit" class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-semibold">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==================== FIREBASE CONFIG (của bạn) ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBIIWxW_jTP1BpGOaIa9atr_sFhRlz3fJ0",
            authDomain: "tienbothi.firebaseapp.com",
            databaseURL: "https://tienbothi-default-rtdb.firebaseio.com",
            projectId: "tienbothi",
            storageBucket: "tienbothi.firebasestorage.app",
            messagingSenderId: "353470247741",
            appId: "1:353470247741:web:2cf921cc96ba0353e2cb54"
        };

        let app, auth, db, currentUser = null;

        function initFirebase() {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.database();
            
            // Listen auth state
            auth.onAuthStateChanged(user => {
                currentUser = user;
                if (user) {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('user-info').innerHTML = `
                        <img src="${user.photoURL || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" 
                             class="w-7 h-7 rounded-full">
                        <span class="font-medium">${user.displayName || 'User'}</span>
                    `;
                    loadData();
                } else {
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('main-app').classList.add('hidden');
                }
            });
        }

        // ==================== GOOGLE LOGIN ====================
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .catch(err => alert("Đăng nhập thất bại: " + err.message));
        }

        function logout() {
            if (confirm("Đăng xuất?")) {
                auth.signOut();
            }
        }

        // ==================== DATA FUNCTIONS (giống code cũ) ====================
        let currentTab = 0;

        function renderCard(nodeName, containerId, data) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (!data || Object.keys(data).length === 0) {
                container.innerHTML = `<div class="bg-white rounded-3xl p-12 text-center text-slate-400">Chưa có dữ liệu</div>`;
                return;
            }

            Object.keys(data).forEach(key => {
                const item = data[key];
                const amount = Number(item.so_tien || 0);
                const isChi = nodeName === 'chi-tieu';

                const cardHTML = `
                    <div class="card bg-white rounded-3xl p-5 border border-slate-100">
                        <div class="flex justify-between">
                            <div class="flex-1">
                                <div class="text-xs text-slate-500">${item.ngay || ''}</div>
                                <div class="font-semibold mt-1">${item.danh_muc || ''}</div>
                                <div class="text-sm text-slate-600 mt-1">${item.mo_ta || ''}</div>
                                ${item.ghi_chu ? `<div class="text-xs text-slate-500 mt-2 italic">${item.ghi_chu}</div>` : ''}
                            </div>
                            <div class="text-right font-bold text-xl ${isChi ? 'text-red-600' : 'text-blue-600'}">
                                ${isChi ? '-' : '+'}${amount.toLocaleString('vi-VN')}
                            </div>
                        </div>
                        <div class="flex gap-3 mt-6">
                            <button onclick="editItem('${nodeName}', '${key}', event)" 
                                    class="flex-1 py-3 text-sm font-medium bg-amber-100 text-amber-700 rounded-2xl">Sửa</button>
                            <button onclick="deleteItem('${nodeName}', '${key}', event)" 
                                    class="flex-1 py-3 text-sm font-medium bg-red-100 text-red-700 rounded-2xl">Xóa</button>
                        </div>
                    </div>`;
                container.innerHTML += cardHTML;
            });
        }

        function loadData() {
            if (!db || !currentUser) return;

            db.ref('chi-tieu').on('value', snap => renderCard('chi-tieu', 'table-chi-tieu', snap.val()));
            db.ref('thu-nhap').on('value', snap => renderCard('thu-nhap', 'table-thu-nhap', snap.val()));
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-button').forEach((b, i) => {
                b.classList.toggle('active', i === tab);
                b.classList.toggle('border-emerald-600', i === tab);
            });
            document.getElementById('content-0').classList.toggle('hidden', tab !== 0);
            document.getElementById('content-1').classList.toggle('hidden', tab !== 1);
        }

        function showAddModal() {
            document.getElementById('modal-title').textContent = currentTab === 0 ? 'Thêm chi tiêu' : 'Thêm thu nhập';
            document.getElementById('node-type').value = currentTab === 0 ? 'chi-tieu' : 'thu-nhap';
            document.getElementById('edit-form').reset();
            document.getElementById('ngay').value = new Date().toISOString().split('T')[0];
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function editItem(nodeName, key, e) {
            e.stopImmediatePropagation();
            document.getElementById('node-type').value = nodeName;
            document.getElementById('edit-key').value = key;
            document.getElementById('modal-title').textContent = 'Sửa khoản';

            db.ref(nodeName + '/' + key).once('value', snap => {
                const d = snap.val();
                if (d) {
                    document.getElementById('ngay').value = d.ngay || '';
                    document.getElementById('danh_muc').value = d.danh_muc || '';
                    document.getElementById('mo_ta').value = d.mo_ta || '';
                    document.getElementById('so_tien').value = d.so_tien || '';
                    document.getElementById('ghi_chu').value = d.ghi_chu || '';
                    document.getElementById('modal').classList.remove('hidden');
                    document.getElementById('modal').classList.add('flex');
                }
            });
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        function handleSubmit(e) {
            e.preventDefault();
            const nodeType = document.getElementById('node-type').value;
            const key = document.getElementById('edit-key').value;
            const ref = db.ref(nodeType);

            const payload = {
                danh_muc: document.getElementById('danh_muc').value.trim(),
                mo_ta: document.getElementById('mo_ta').value.trim(),
                ngay: document.getElementById('ngay').value,
                so_tien: parseInt(document.getElementById('so_tien').value) || 0,
                ghi_chu: document.getElementById('ghi_chu').value.trim() || null,
                thoi_gian: Date.now()
            };

            if (key) {
                ref.child(key).update(payload).then(() => { alert('Đã lưu!'); hideModal(); });
            } else {
                ref.push(payload).then(() => { alert('Đã thêm!'); hideModal(); });
            }
        }

        function deleteItem(nodeName, key, e) {
            e.stopImmediatePropagation();
            if (confirm('Xóa khoản này?')) {
                db.ref(nodeName + '/' + key).remove();
            }
        }

        // ==================== KHỞI ĐỘNG ====================
        window.onload = () => {
            initFirebase();
        };
    </script>
</body>
</html>
