<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mèo</title>
  
  <!-- Favicon / Icon cho Website -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 12px;
    }

    .container { 
      max-width: 950px; 
      margin: 0 auto; 
      background: var(--card-bg); 
      padding: 28px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .app-title { font-size: 24px; font-weight: 700; color: #111827; display: flex; align-items: center; gap: 8px; }

    /* Buttons */
    button { 
      padding: 10px 18px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 14px; 
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary { background: var(--primary); color: white; }
    .google { background: #ea4335; color: white; }
    .facebook { background: #1877f2; color: white; }
    .logout { background: #ef4444; color: white; padding: 6px 12px; font-size: 13px; }

    /* Login Screen */
    #loginSection { text-align: center; padding: 40px 10px; }
    #loginSection h2 { margin-bottom: 12px; font-size: 20px; }
    #loginSection p { color: var(--text-muted); margin-bottom: 24px; }
    .auth-buttons { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

    /* Forms & Inputs */
    .form-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    input, select { 
      padding: 12px 14px; 
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      flex: 1;
      min-width: 200px;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    input[type="file"] { padding: 8px; background: #ffffff; cursor: pointer; }

    /* Stats Cards */
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 16px; 
      margin: 20px 0 28px 0; 
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 12px;
    }
    .stat-card .label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: var(--primary); margin-top: 4px; }

    /* Table */
    .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: #f9fafb; padding: 12px 16px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-weight: 600; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: #f9fafb; }
    
    /* Cải tiến hiển thị ảnh Mèo */
    .cat-thumb-wrapper {
      position: relative;
      display: inline-block;
      width: 72px;
      height: 72px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: #f1f5f9;
    }
    .cat-thumb-wrapper:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      border-color: var(--primary);
    }
    .cat-thumb { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block;
    }
    .no-img { 
      color: var(--text-muted); 
      font-size: 12px; 
      font-style: italic; 
      background: #f1f5f9;
      padding: 6px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-details span { font-weight: 600; }
    .uid-badge { 
      font-size: 11px; 
      color: var(--text-muted); 
      background: #e5e7eb; 
      padding: 2px 6px; 
      border-radius: 4px; 
      font-family: monospace;
    }
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #374151; }

    /* Image Lightbox Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-header">
      <div class="app-title">🐱 CatTrip</div>
      <div id="userInfo" class="user-info" style="display:none;">
        <div class="user-details">
          <span id="userName">Tài xế</span>
          <div id="userUid" class="uid-badge"></div>
        </div>
        <button class="logout" onclick="logout()">Đăng xuất</button>
      </div>
    </div>

    <!-- Login Section -->
    <div id="loginSection">
      <h2>Chào mừng bạn đến với CatTrip!</h2>
      <p>Quản lý chuyến xe và lưu trữ hình ảnh mèo nén dung lượng siêu nhỏ.</p>
      <div class="auth-buttons">
        <button class="google" onclick="loginWithGoogle()">Đăng nhập Google</button>
        <button class="facebook" onclick="loginWithFacebook()">Đăng nhập Facebook</button>
      </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard" style="display:none;">
      
      <!-- Stats Summary -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">Tổng số chuyến</div>
          <div class="value" id="statTrips">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Tổng doanh thu</div>
          <div class="value" id="statMoney">0 ₫</div>
        </div>
        <div class="stat-card">
          <div class="label">Trung bình / Chuyến</div>
          <div class="value" id="statAvg">0 ₫</div>
        </div>
      </div>

      <!-- Add Trip Form -->
      <div style="background: #f9fafb; padding: 20px; border-radius: 12px; margin-bottom: 28px; border: 1px solid var(--border-color);">
        <div class="section-title">📍 Thêm chuyến xe & Ảnh mèo</div>
        <div class="form-group">
          <div class="form-row">
            <input type="text" id="route" placeholder="Tuyến đường (VD: Hà Nội - Nội Bài)">
            <input type="number" id="fare" placeholder="Tiền chuyến (VND)">
          </div>
          <div class="form-row">
            <input type="file" id="catImage" accept="image/*">
            <button class="btn-primary" onclick="addTripWithCat()">➕ Thêm chuyến xe</button>
          </div>
        </div>
      </div>

      <!-- Trip Table -->
      <div class="section-title">📋 Lịch sử chuyến xe</div>
      <div class="table-container">
        <table id="tripTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Tuyến đường</th>
              <th>Tiền chuyến</th>
              <th>Hình ảnh Mèo</th>
              <th>Thời gian</th>
            </tr>
          </thead>
          <tbody>
            <!-- Loaded dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal xem ảnh phóng to -->
  <div id="imageModal" class="modal-overlay" onclick="closeModal()">
    <img id="modalImg" class="modal-content" src="" alt="Cat Large View">
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCR_2mrPthGL8gOzkbjThM5mlI7fKEG7Vg",
      authDomain: "sound-19c50.firebaseapp.com",
      databaseURL: "https://sound-19c50-default-rtdb.firebaseio.com",
      projectId: "sound-19c50",
      storageBucket: "sound-19c50.firebasestorage.app",
      messagingSenderId: "150852760500",
      appId: "1:150852760500:web:3c8a9c8318a26c6a7bf8e1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(e => alert(e.message));
    }

    function loginWithFacebook() {
      const provider = new firebase.auth.FacebookAuthProvider();
      auth.signInWithPopup(provider).catch(e => alert(e.message));
    }

    function showDashboard(user) {
      currentUser = user;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('userInfo').style.display = 'flex';
      
      document.getElementById('userName').textContent = user.displayName || user.email.split('@')[0];
      document.getElementById('userUid').textContent = `UID: ${user.uid.substring(0, 8)}...`;
      
      loadTripsByUid(user.uid);
    }

    // Nén ảnh mèo tối ưu với khung hình chất lượng rõ nét hơn
    async function compressCatImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 500; // Tăng kích thước lên 500px giúp hiển thị rõ nét hơn
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_SIZE) { height = (MAX_SIZE / width) * height; width = MAX_SIZE; }
            } else {
              if (height > MAX_SIZE) { width = (MAX_SIZE / height) * width; height = MAX_SIZE; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Nén xuống mức chất lượng 0.55 giữ chi tiết tốt mà dung lượng vẫn nhẹ
            const base64 = canvas.toDataURL('image/jpeg', 0.55);
            resolve(base64);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function addTripWithCat() {
      if (!currentUser) {
        alert("Vui lòng đăng nhập!");
        return;
      }

      const routeInput = document.getElementById('route');
      const fareInput = document.getElementById('fare');
      const fileInput = document.getElementById('catImage');

      const route = routeInput.value.trim();
      const fare = parseInt(fareInput.value);

      if (!route || isNaN(fare)) {
        alert("Vui lòng nhập đầy đủ tuyến đường và tiền chuyến hợp lệ!");
        return;
      }

      let catBase64 = null;
      if (fileInput.files[0]) {
        catBase64 = await compressCatImage(fileInput.files[0]);
      }

      // Lưu trữ dữ liệu phân tách rõ ràng theo UID người dùng
      const tripRef = db.ref(`users/${currentUser.uid}/trips`).push();
      
      tripRef.set({
        uid: currentUser.uid,
        route: route,
        fare: fare,
        catImage: catBase64,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        routeInput.value = '';
        fareInput.value = '';
        fileInput.value = '';
      }).catch(err => alert("Lỗi khi lưu dữ liệu: " + err.message));
    }

    function loadTripsByUid(uid) {
      const tbody = document.querySelector('#tripTable tbody');

      // Tự động lắng nghe dữ liệu cập nhật theo UID
      db.ref(`users/${uid}/trips`).on('value', snapshot => {
        tbody.innerHTML = '';
        let totalTrips = 0, totalMoney = 0;
        const trips = [];

        snapshot.forEach(child => {
          trips.push({ id: child.key, ...child.val() });
        });

        if (trips.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;">Chưa có chuyến xe nào được ghi nhận.</td></tr>`;
        } else {
          // Sắp xếp chuyến xe mới nhất lên đầu
          trips.reverse().forEach((t, index) => {
            totalTrips++;
            totalMoney += t.fare || 0;

            let imgHtml = t.catImage 
              ? `<div class="cat-thumb-wrapper" onclick="openModal('${t.catImage}')" title="Nhấp để phóng to">
                   <img class="cat-thumb" src="${t.catImage}" alt="Ảnh Mèo">
                 </div>` 
              : `<span class="no-img">Không ảnh</span>`;

            const dateFormatted = t.timestamp ? new Date(t.timestamp).toLocaleString('vi-VN') : 'Mới tạo';

            const row = `
              <tr>
                <td><strong>${trips.length - index}</strong></td>
                <td><strong>${t.route}</strong></td>
                <td style="color: var(--primary); font-weight: 600;">${(t.fare || 0).toLocaleString('vi-VN')} ₫</td>
                <td>${imgHtml}</td>
                <td style="color: var(--text-muted); font-size: 13px;">
                  ${dateFormatted}
                </td>
              </tr>`;
            tbody.innerHTML += row;
          });
        }

        // Cập nhật các thẻ Thống kê
        document.getElementById('statTrips').textContent = totalTrips;
        document.getElementById('statMoney').textContent = totalMoney.toLocaleString('vi-VN') + ' ₫';
        document.getElementById('statAvg').textContent = totalTrips > 0 
          ? Math.round(totalMoney / totalTrips).toLocaleString('vi-VN') + ' ₫' 
          : '0 ₫';
      });
    }

    // Modal phóng to ảnh
    function openModal(imgSrc) {
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function logout() { 
      auth.signOut().then(() => location.reload()); 
    }

    // Tự động kiểm tra trạng thái đăng nhập
    auth.onAuthStateChanged(user => { 
      if (user) {
        showDashboard(user);
      } else {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('userInfo').style.display = 'none';
      }
    });
  </script>
</body>
</html>
